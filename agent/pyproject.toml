[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-agent"
version = "0.1.0"
description = "LangGraph-based aviation intelligence agent with MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core LangChain/LangGraph
    "pydantic>=2.10.6",
    "langgraph>=1.0.0",
    "langgraph-prebuilt>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain>=0.3.0",

    # MCP Protocol
    "mcp>=1.5.0",
    "fastmcp>=2.10.2",

    # HTTP / Async
    "aiohttp>=3.8.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",

    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn>=0.30.0",

    # Database
    "asyncpg>=0.29.0",

    # Memory & RAG
    "mem0ai>=0.1.0",
    "openai>=1.0.0",
    "rank-bm25>=0.2.2",

    # Caching
    "redis>=5.0.0",
    "hiredis>=2.3.0",

    # Observability
    "langsmith>=0.3.13",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.9.4",
    "apscheduler>=3.10.4",
    "PyJWT[crypto]>=2.9.0",
    "livekit-api>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
repository = "https://github.com/angadsgrover/capstone"

[tool.setuptools]
packages = ["agent"]
include-package-data = true
