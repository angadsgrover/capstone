services:
  # ── Databases ───────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MCP servers (SSE transport, internal network only) ───────────────────────
  mcp-aviation-wx:
    build: ./aviation-weather-mcp-python
    environment:
      TRANSPORT_MODE: sse
      HOST: 0.0.0.0
      PORT: "8001"
    expose: ["8001"]
    restart: unless-stopped

  mcp-hk-climate:
    build: ./hk-climate-mcp-server-python
    environment:
      TRANSPORT_MODE: sse
      HOST: 0.0.0.0
      PORT: "8002"
    expose: ["8002"]
    restart: unless-stopped

  mcp-adsb:
    build: ./adsb_mcp
    environment:
      TRANSPORT_MODE: sse
      HOST: 0.0.0.0
      PORT: "8003"
    expose: ["8003"]
    restart: unless-stopped

  # ── Agent (FastAPI + LangGraph) ──────────────────────────────────────────────
  agent:
    build: ./agent
    environment:
      MCP_CONFIG: /app/mcp_config.docker.json
      POSTGRES_DSN: postgresql://capstone:${POSTGRES_PASSWORD}@postgres:5432/capstone
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      LLM_API_KEY: ${LLM_API_KEY}
      MODEL_CHOICE: ${MODEL_CHOICE}
      BASE_URL: ${BASE_URL}
      # Optional: separate embedding provider (default falls back to BASE_URL/LLM_API_KEY)
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-aviation-wx:
        condition: service_started
      mcp-hk-climate:
        condition: service_started
      mcp-adsb:
        condition: service_started
    restart: unless-stopped

  # ── Frontend (nginx + Vite build, reverse-proxies /api → agent) ─────────────
  frontend:
    build: ./frontend-app
    ports:
      - "80:80"
    depends_on:
      - agent
    restart: unless-stopped

  # ── Dev tooling ──────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles: ["dev"]

  # ── Optional graph DB ────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    profiles: ["graph"]

volumes:
  pgdata:
  redisdata:
  neo4jdata:
