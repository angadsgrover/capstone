services:
  # ── Databases ───────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MCP servers (SSE transport, internal network only) ───────────────────────
  mcp-aviation-wx:
    build: ./aviation-weather-mcp-python
    environment:
      TRANSPORT_MODE: sse
      HOST: 0.0.0.0
      PORT: "8001"
    expose: ["8001"]
    restart: unless-stopped

  mcp-hk-climate:
    build: ./hk-climate-mcp-server-python
    environment:
      TRANSPORT_MODE: sse
      HOST: 0.0.0.0
      PORT: "8002"
    expose: ["8002"]
    restart: unless-stopped

  mcp-adsb:
    build: ./adsb_mcp
    environment:
      TRANSPORT_MODE: sse
      HOST: 0.0.0.0
      PORT: "8003"
    expose: ["8003"]
    restart: unless-stopped

  # ── Agent (FastAPI + LangGraph) ──────────────────────────────────────────────
  agent:
    build: ./agent
    environment:
      MCP_CONFIG: /app/mcp_config.docker.json
      POSTGRES_DSN: postgresql://capstone:${POSTGRES_PASSWORD}@postgres:5432/capstone
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      LLM_API_KEY: ${LLM_API_KEY}
      MODEL_CHOICE: ${MODEL_CHOICE}
      BASE_URL: ${BASE_URL}
      # Optional: separate embedding provider (default falls back to BASE_URL/LLM_API_KEY)
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      # Transcription (for voice input in browsers without Web Speech API)
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-google/gemini-2.5-flash}
      # LiveKit (for real-time voice features)
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      # Memory providers
      MEM0_API_KEY: ${MEM0_API_KEY:-${MEM0_KEY:-}}
      MEM0_LONG_TERM_ENABLED: ${MEM0_LONG_TERM_ENABLED:-true}
      MEM0_LONG_TERM_USER_ID: ${MEM0_LONG_TERM_USER_ID:-aviation_knowledge_base}
      MEM0_SHORT_TERM_APP_ID: ${MEM0_SHORT_TERM_APP_ID:-chat_sessions}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-default}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      # Hardening + scale controls
      EXECUTION_MODE: ${EXECUTION_MODE:-queued}
      ENABLE_WORKFLOW_WORKER: "false"
      EVENT_BACKEND: ${EVENT_BACKEND:-redis}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:80,http://localhost:5173}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      REQUIRE_AUTH_SUBJECT: ${REQUIRE_AUTH_SUBJECT:-false}
      AUTH_SUBJECT_USER_HEADER: ${AUTH_SUBJECT_USER_HEADER:-x-user-id}
      AUTH_SUBJECT_TENANT_HEADER: ${AUTH_SUBJECT_TENANT_HEADER:-x-tenant-id}
      AUTH_VERIFICATION_MODE: ${AUTH_VERIFICATION_MODE:-none}
      AUTH_ALLOW_HEADER_FALLBACK: ${AUTH_ALLOW_HEADER_FALLBACK:-true}
      AUTH_REQUIRE_VERIFIED_SUBJECT: ${AUTH_REQUIRE_VERIFIED_SUBJECT:-false}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
      JWT_SUBJECT_CLAIM: ${JWT_SUBJECT_CLAIM:-sub}
      JWT_USER_ID_CLAIM: ${JWT_USER_ID_CLAIM:-sub}
      JWT_TENANT_ID_CLAIM: ${JWT_TENANT_ID_CLAIM:-tenant_id}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-12000}
      MAX_SESSION_ID_CHARS: ${MAX_SESSION_ID_CHARS:-128}
      MAX_CONCURRENT_GRAPH_RUNS: ${MAX_CONCURRENT_GRAPH_RUNS:-120}
      MAX_PENDING_EVENT_STREAMS: ${MAX_PENDING_EVENT_STREAMS:-2000}
      EVENT_QUEUE_MAXSIZE: ${EVENT_QUEUE_MAXSIZE:-512}
      RUN_REGISTRY_TTL_SECONDS: ${RUN_REGISTRY_TTL_SECONDS:-900}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AGENT_PER_WINDOW: ${RATE_LIMIT_AGENT_PER_WINDOW:-30}
      RATE_LIMIT_STREAM_PER_WINDOW: ${RATE_LIMIT_STREAM_PER_WINDOW:-20}
      RATE_LIMIT_EXECUTE_PER_WINDOW: ${RATE_LIMIT_EXECUTE_PER_WINDOW:-20}
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-aviation-wx:
        condition: service_started
      mcp-hk-climate:
        condition: service_started
      mcp-adsb:
        condition: service_started
    restart: unless-stopped

  # ── Agent Worker (queue consumer for long workflows) ───────────────────────
  agent-worker:
    build: ./agent
    command: ["python", "server.py"]
    environment:
      AGENT_PROCESS_MODE: worker
      MCP_CONFIG: /app/mcp_config.docker.json
      POSTGRES_DSN: postgresql://capstone:${POSTGRES_PASSWORD}@postgres:5432/capstone
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      LLM_API_KEY: ${LLM_API_KEY}
      MODEL_CHOICE: ${MODEL_CHOICE}
      BASE_URL: ${BASE_URL}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-google/gemini-2.5-flash}
      MEM0_API_KEY: ${MEM0_API_KEY:-${MEM0_KEY:-}}
      MEM0_LONG_TERM_ENABLED: ${MEM0_LONG_TERM_ENABLED:-true}
      MEM0_LONG_TERM_USER_ID: ${MEM0_LONG_TERM_USER_ID:-aviation_knowledge_base}
      MEM0_SHORT_TERM_APP_ID: ${MEM0_SHORT_TERM_APP_ID:-chat_sessions}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-default}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      EXECUTION_MODE: ${EXECUTION_MODE:-queued}
      EVENT_BACKEND: ${EVENT_BACKEND:-redis}
      WORKFLOW_QUEUE_KEY: ${WORKFLOW_QUEUE_KEY:-agent:workflow:queue}
      AUTH_VERIFICATION_MODE: ${AUTH_VERIFICATION_MODE:-none}
      AUTH_ALLOW_HEADER_FALLBACK: ${AUTH_ALLOW_HEADER_FALLBACK:-true}
      AUTH_REQUIRE_VERIFIED_SUBJECT: ${AUTH_REQUIRE_VERIFIED_SUBJECT:-false}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
      JWT_SUBJECT_CLAIM: ${JWT_SUBJECT_CLAIM:-sub}
      JWT_USER_ID_CLAIM: ${JWT_USER_ID_CLAIM:-sub}
      JWT_TENANT_ID_CLAIM: ${JWT_TENANT_ID_CLAIM:-tenant_id}
      MAX_CONCURRENT_GRAPH_RUNS: ${MAX_CONCURRENT_GRAPH_RUNS:-120}
      RUN_REGISTRY_TTL_SECONDS: ${RUN_REGISTRY_TTL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-aviation-wx:
        condition: service_started
      mcp-hk-climate:
        condition: service_started
      mcp-adsb:
        condition: service_started
    restart: unless-stopped

  # ── Frontend (nginx + Vite build, reverse-proxies /api → agent) ─────────────
  frontend:
    build: ./frontend-app
    ports:
      - "80:80"
    depends_on:
      - agent
    restart: unless-stopped

  # ── Dev tooling ──────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles: ["dev"]

  # ── Optional graph DB ────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    profiles: ["graph"]

volumes:
  pgdata:
  redisdata:
  neo4jdata:
