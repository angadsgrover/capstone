server {
    listen 80;
    server_name _;

    # Serve Vite SPA
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy /api/* to the agent FastAPI service.
    # Docker DNS resolves "agent" to the container IP.
    location /api/ {
        proxy_pass         http://agent:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE: disable buffering so chunks reach the browser immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;

        # Allow SSE Connection header through
        proxy_set_header   Connection        '';
        chunked_transfer_encoding on;
    }

    # React Router: all unknown paths serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
