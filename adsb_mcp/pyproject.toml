[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb_mcp_server"
version = "0.1.0"
description = "Model Context Protocol server for ADS-B aircraft tracking data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.10.2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools]
py-modules = ["server", "db"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
