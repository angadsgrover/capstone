# Production Docker Compose - Cloud Ready
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ── Databases with resource limits ─────────────────────────────────────────
  postgres:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── MCP Servers with health checks ─────────────────────────────────────────
  mcp-aviation-wx:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  mcp-hk-climate:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  mcp-adsb:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  # ── Agent with health check ────────────────────────────────────────────────
  agent:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
    environment:
      # Production settings
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: always

  # ── Frontend with health check ─────────────────────────────────────────────
  frontend:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always
